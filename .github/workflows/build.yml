name: build

# Builds the extension zip for every Ghidra release in the matrix and runs the
# smoke tests against it.  Pushing a v* tag also publishes a GitHub release
# with one zip per Ghidra version.

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated SLEIGH is up to date
        run: |
          tools/regen.sh
          git diff --exit-code || { echo "::error::regenerate with tools/regen.sh and commit the result"; exit 1; }

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ghidra only installs an extension built for its exact version.
        ghidra: [ "12.1.4", "12.1.3", "12.0.4" ]
    env:
      # Under scratch/, which build.gradle keeps out of the zip: buildExtension
      # packs everything else in the workspace.
      GHIDRA_INSTALL_DIR: ${{ github.workspace }}/scratch/ghidra/ghidra_${{ matrix.ghidra }}_PUBLIC
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        id: ghidra-cache
        with:
          path: scratch/ghidra
          key: ghidra-${{ matrix.ghidra }}

      - name: Download Ghidra ${{ matrix.ghidra }}
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          gh release download "Ghidra_${{ matrix.ghidra }}_build" -R NationalSecurityAgency/ghidra \
            --pattern "ghidra_${{ matrix.ghidra }}_PUBLIC_*.zip" --dir "$RUNNER_TEMP"
          mkdir -p scratch/ghidra
          unzip -q "$RUNNER_TEMP"/ghidra_*.zip -d scratch/ghidra

      - uses: actions/cache@v4
        with:
          path: scratch/gradle
          key: gradle-${{ matrix.ghidra }}

      - name: Build
        run: tools/build.sh --install

      - name: Smoke test
        run: tests/smoke.sh

      - uses: actions/upload-artifact@v4
        with:
          name: extension-ghidra-${{ matrix.ghidra }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ generated, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish ${{ github.ref_name }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip -R "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
